plugins {
    id 'com.android.application'
}

android {
    namespace 'org.matramitra.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.matramitra.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // keep fonts uncompressed in the APK so the WebView can stream them
    androidResources {
        noCompress 'ttf'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
